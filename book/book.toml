# mdBook configuration for the Cavitation guide. Build with `mdbook build book` from the
# repository root; the HTML goes to book/book/.

[book]
title = "The Cavitation Guide"
description = "How neural networks learn, worked through by hand with the cavitation library."
language = "en"
src = "src"

[output.html]
git-repository-url = "https://github.com/Idle-Sync/cavitation"

[output.html.playground]
runnable = false
