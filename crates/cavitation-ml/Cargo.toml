# Package manifest for cavitation-ml: classic machine learning (least squares, regression) in f64.

[package]
name = "cavitation-ml"
description = "Classic machine learning for the cavitation library: least squares and regression in f64."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
cavitation-core = { path = "../cavitation-core", version = "0.1.0" }
# `Dataset`, `Linear`, `Sequential` and the training pieces the gradient path runs on.
cavitation-nn = { path = "../cavitation-nn", version = "0.1.0" }

[dev-dependencies]
# Reads the scikit-learn fixtures in tests/fixtures/sklearn (JSON); `float_roundtrip` reads
# every number to the exact f64 it was written from (the default parser can be 1 ulp off).
serde_json = { version = "1", features = ["float_roundtrip"] }
# The Concrete and Breast Cancer rows that the data set fixtures refer to.
cavitation-datasets = { path = "../cavitation-datasets" }
