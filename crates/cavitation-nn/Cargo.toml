# Package manifest for cavitation-nn: layers, optimisers and training.

[package]
name = "cavitation-nn"
description = "Layers, optimisers and training for the cavitation neural network library."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true


[dependencies]
cavitation-core = { path = "../cavitation-core", version = "0.1.0" }

[dev-dependencies]
# Reads the PyTorch fixtures in tests/fixtures/layers (JSON).
serde_json = "1"

[[test]]
name = "no_alloc"
harness = false
