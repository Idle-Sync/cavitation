# Package manifest for cavitation-nn: layers, optimisers and training.

[package]
name = "cavitation-nn"
description = "Layers, optimisers and training for the cavitation neural network library."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
cavitation-core = { path = "../cavitation-core", version = "0.2.0" }
safetensors = "0.8.0"

[dev-dependencies]
# Reads the PyTorch fixtures in tests/fixtures (JSON).
serde_json = "1"

[[test]]
name = "no_alloc"
harness = false
