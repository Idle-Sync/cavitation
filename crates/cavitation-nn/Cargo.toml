# Package manifest for cavitation-nn: layers, optimisers and training.

[package]
name = "cavitation-nn"
description = "Layers, optimisers and training for the cavitation neural network library."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
cavitation-core = { path = "../cavitation-core", version = "0.4.1" }
safetensors = "0.8.0"
# Training and inference on the GPU, behind the `gpu` feature (off by default).
cavitation-gpu = { path = "../cavitation-gpu", version = "0.4.1", optional = true }
# Training and inference through NVIDIA's CUDA, behind the `cuda` feature (off by default).
cavitation-cuda = { path = "../cavitation-cuda", version = "0.4.1", optional = true }

[features]
# GPU mode through wgpu; it adds wgpu and its dependencies to the build.
gpu = ["dep:cavitation-gpu"]
# Training on NVIDIA cards through CUDA, cuDNN and cuBLAS, loaded when the program runs; it
# adds `cavitation-cuda`, which links to nothing, to the build.
cuda = ["dep:cavitation-cuda"]

[dev-dependencies]
# Reads the PyTorch fixtures in tests/fixtures (JSON).
serde_json = "1"

[[test]]
name = "no_alloc"
harness = false

# Counts host allocations across warm GPU training steps; it installs its own global
# allocator, so it runs alone, without the test harness.
[[test]]
name = "gpu_step_alloc"
harness = false
required-features = ["gpu"]
