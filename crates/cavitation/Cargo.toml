# Package manifest for cavitation, the main crate to depend on.

[package]
name = "cavitation"
description = "A fast, glass-box neural network library for the CPU."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"

[lints]
workspace = true

[dependencies]
cavitation-core = { path = "../cavitation-core", version = "0.1.0" }
cavitation-nn = { path = "../cavitation-nn", version = "0.1.0" }
cavitation-ml = { path = "../cavitation-ml", version = "0.1.0", optional = true }
cavitation-inspect = { path = "../cavitation-inspect", version = "0.1.0", optional = true }

[features]
default = ["ml"]
# Classic machine learning (least squares, regression), re-exported as `cavitation::cavitation_ml`.
ml = ["dep:cavitation-ml"]
# The live training view in the browser, re-exported as `cavitation::cavitation_inspect`; off by default.
inspect = ["dep:cavitation-inspect"]

[dev-dependencies]
# Real datasets for the examples and known-result tests.
cavitation-datasets = { path = "../cavitation-datasets" }

# The regression examples use the classic models, which the `ml` feature provides.
[[example]]
name = "linear_regression"
required-features = ["ml"]

[[example]]
name = "logistic_regression"
required-features = ["ml"]

# The inspector example needs the inspector, which the `inspect` feature provides.
[[example]]
name = "inspect_digits"
required-features = ["inspect"]
